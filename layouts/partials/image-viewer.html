<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="{{ i18n "lightbox_label" }}">
  <div class="lightbox-inner" id="lightboxInner">
    <div class="viewer-toolbar">
      <button type="button" data-zoom="out" aria-label="{{ i18n "ui_zoomout" }}">−</button>
      <output id="viewerScale" aria-live="polite">100%</output>
      <button type="button" data-zoom="in" aria-label="{{ i18n "ui_zoomin" }}">+</button>
      <button type="button" data-zoom="fit">{{ i18n "ui_zoomfit" }}</button>
      <button type="button" data-zoom="actual">{{ i18n "ui_zoomactual" }}</button>
      <a id="viewerOriginal" target="_blank" rel="noopener">{{ i18n "ui_zoomoriginal" }} ↗</a>
      <button class="viewer-close" id="lightboxClose" type="button" aria-label="{{ i18n "lightbox_close" }}">×</button>
    </div>
    <div class="viewer-viewport" id="viewerViewport" tabindex="0" role="region" aria-label="{{ i18n "ui_zoomviewport" }}"><div class="viewer-media" id="viewerMedia"></div></div>
    <div class="viewer-caption"><span id="viewerCaption"></span><span class="viewer-help">{{ i18n "ui_zoomhelp" }}</span></div>
  </div>
</div>
