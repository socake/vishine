{{- /*
  changelog/list.html — 更新日志【时间线】。
  未使用 changelog shortcode 时保留手写时间线。
  使用自动归档时由组件承担月份卡片，避免叠加旧时间线的竖线与节点。
*/ -}}
{{ define "main" }}
<main class="wrap">
  <section class="sec">
    <header class="list-hero">
      <span class="kicker"><span class="dot"></span>changelog</span>
      <h1 class="list-title">{{ .Title }}</h1>
      {{ with .Description }}<p class="list-desc">{{ . }}</p>{{ end }}
    </header>

    <div class="{{ if .HasShortcode "changelog" }}changelog-page{{ else }}changelog-timeline{{ end }} prose">
      {{ .Content }}
    </div>
  </section>
</main>
{{ end }}
